---
- name: Install HAProxy
  apt:
    name: haproxy
    state: present

- name: Install Nginx and stream module
  apt:
    name:
      - nginx
      - libnginx-mod-stream
    state: present

- name: Write HAProxy config from template
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    backup: yes

- name: Enable and restart HAProxy
  systemd:
    name: haproxy
    enabled: yes
    state: restarted

- name: Remove default nginx http server block
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Remove existing stream block from nginx.conf if present
  blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED STREAM BLOCK"
    state: absent

- name: Write Nginx stream block for SNMP UDP load balancing
  blockinfile:
    path: /etc/nginx/nginx.conf
    marker: "# {mark} ANSIBLE MANAGED STREAM BLOCK"
    block: |
      stream {
          upstream snmp_backend {
      {% for ip in node_ips.split(',') %}
              server {{ ip }}:161;
      {% endfor %}
          }
          server {
              listen 6000 udp;
              proxy_pass snmp_backend;
              proxy_responses 1;
              proxy_timeout 3s;
          }
      }

- name: Test Nginx configuration
  command: nginx -t
  changed_when: false

- name: Enable and restart Nginx
  systemd:
    name: nginx
    enabled: yes
    state: restarted
    daemon_reload: yes
